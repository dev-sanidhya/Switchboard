services:
  gateway:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Persist the SQLite file outside the container
      - switchboard_data:/app/data
    environment:
      DATABASE_URL: /app/data/switchboard.db
      GROQ_API_KEY: ${GROQ_API_KEY}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      CACHE_MAX_ITEMS: ${CACHE_MAX_ITEMS:-500}
      CB_FAILURE_THRESHOLD: ${CB_FAILURE_THRESHOLD:-5}
      CB_RESET_TIMEOUT_MS: ${CB_RESET_TIMEOUT_MS:-60000}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-3}
      RETRY_BASE_DELAY_MS: ${RETRY_BASE_DELAY_MS:-100}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-30000}
      STREAM_FIRST_TOKEN_TIMEOUT_MS: ${STREAM_FIRST_TOKEN_TIMEOUT_MS:-5000}
      ENABLE_TEST_ENDPOINTS: ${ENABLE_TEST_ENDPOINTS:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  switchboard_data:
